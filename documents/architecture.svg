<text x="625" y="650" font-size="9.5" fill="#5a6b7b" text-anchor="middle">verify ID token</text>
<path d="M 830,660 L 830,712 L 1270,712 L 1270,764" fill="none" stroke="#9a6700" stroke-width="1.5" marker-end="url(#ah-amber)"/>
