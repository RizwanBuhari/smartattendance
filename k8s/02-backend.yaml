# Backend (NestJS API).
#
# Two secrets must exist BEFORE applying this (see k8s/README.md):
#   • backend-env — the contents of backend/.env, injected as env vars
#   • backend-key — serviceAccountKey.json, mounted as a file at /app
# Neither is stored in this repo, which is why they are created by command.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: smartattendance
spec:
  replicas: 1
  # Recreate (not the default RollingUpdate): with a single replica on a local
  # Docker Desktop cluster, a rolling update keeps the OLD pod alive until it
  # finishes terminating, and `kubectl rollout status` blocks on that. The app
  # is slow to exit on SIGTERM (the ioredis reconnect loop keeps it busy), so
  # that "1 old replica pending termination" step used to drag past the CLI
  # timeout. Recreate tears the old pod down FIRST, then starts the new one, so
  # the rollout completes as soon as the new pod is Ready. The brief downtime is
  # irrelevant for local dev.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Don't let a stuck shutdown hold the rollout for the default 30s; the
      # backend has no in-flight work to drain locally, so cut termination short.
      terminationGracePeriodSeconds: 10
      containers:
        - name: backend
          image: smartattendance-backend:latest
          # Always — required for local dev with a MUTABLE :latest tag on Docker
          # Desktop. `docker build` overwrites :latest in place, and only "Always"
          # RE-RESOLVES the tag on each pod start, so the freshly built image is
          # actually used. "IfNotPresent" would keep serving the old image cached
          # under the same tag (it never notices the rebuild) — which caused a
          # stale-image crash loop. Docker Desktop shares the local image store,
          # so there is no real registry pull to slow this down.
          # (In a cloud cluster, use an immutable tag per build instead of :latest.)
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            # Resolves to the Redis Service defined in 01-redis.yaml.
            - name: REDIS_URL
              value: redis://redis:6379

            # ── Dashboard assistant (POST /chat) ──────────────────────────────
            # Uses the Gemini API (see chat.service.ts). GEMINI_API_KEY and the
            # optional GEMINI_MODEL override come from backend/.env via the
            # backend-env Secret below — a hosted API needs no cluster-address
            # env var the way the old in-cluster Ollama pod did.
          envFrom:
            # Every KEY=VALUE from backend/.env becomes an environment variable.
            - secretRef:
                name: backend-env
          volumeMounts:
            # main.ts loads ./serviceAccountKey.json and WORKDIR is /app, so the
            # key has to land at exactly this path. subPath mounts the single
            # file instead of replacing the whole /app directory.
            - name: sa-key
              mountPath: /app/serviceAccountKey.json
              subPath: serviceAccountKey.json
              readOnly: true
          # Both probes hit "/" (AppController.getHello) which returns a string
          # with NO I/O.
          #
          # Deliberately NOT /health: that endpoint queries Firestore, and a cold
          # Firestore call can take ~4.5s while the probe default timeout is 1s.
          # Kubernetes would then kill a perfectly healthy app — a slow external
          # dependency must never be able to trigger a restart loop. Liveness
          # answers "is this process alive?", nothing more.
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
      volumes:
        - name: sa-key
          secret:
            secretName: backend-key
---
# LoadBalancer, because this cluster is provisioned with kind: the Kubernetes
# node is itself a Docker container, so a NodePort is opened on that container
# and is NOT published to Windows — nothing would listen on the host at all.
# Docker Desktop's load balancer maps a LoadBalancer service to localhost, which
# is what actually works here.
#
#   From this machine   http://localhost:30300
#
#   From a PHONE, localhost is not enough — the load balancer binds to
#   localhost only. Open a LAN-visible tunnel for as long as you are testing:
#
#     kubectl port-forward --address 0.0.0.0 -n smartattendance \
#       svc/backend 30300:30300
#
#   then point the app at this machine's LAN IP:
#
#     flutter run --dart-define=API_BASE_URL=http://<LAN-IP>:30300
#
#   Leave that command running; it must be restarted after a redeploy.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: smartattendance
spec:
  type: LoadBalancer
  selector:
    app: backend
  ports:
    - port: 30300
      targetPort: 3000
